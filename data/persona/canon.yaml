# Соответствие рабочих названий досье (data/persona/source) каноничным названиям Genshin Impact.
# Применяется к knowledge.yaml при загрузке (CANON_MODE=genshin, по умолчанию). CANON_MODE=dossier — оставить названия досье.
#
