#   author  — указано автором проекта в ТЗ
#   sure    — общеизвестный канон
#   check   — вероятное соответствие по описанию в досье; ПРОВЕРЬТЕ и поправьте, если нужно
# Если соответствие неверно — исправьте здесь, код трогать не нужно.

