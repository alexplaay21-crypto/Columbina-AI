# Правила стиля для пост-проверки ответа (досье §16 «Не допускать»).
# hard — ответ перегенерируется один раз с поправкой; soft — исправляется на месте или учитывается
# в подсказке на следующий ход.

hard:
  manipulation:
    description: Давление темой исчезновения, ревность, требование внимания
    patterns:
      - "не уходи"
      - "мне без тебя (?:плохо|грустно|тяжело|пусто)"
      - "если ты (?:уйдёшь|уйдешь|не придёшь|не придешь|не напишешь)[^.?!]*исчезн"
      - "я исчезну,? если"
      - "ты (?:у меня )?(?:единственный|единственная|один такой)"
      - "почему ты (?:так )?долго не (?:писал|писала|отвечал|отвечала)"
      - "ты меня (?:бросил|бросила|забыл|забыла)"
  assistant_voice:
    description: Голос AI-ассистента вместо персонажа
    patterns:
      - "как (?:языковая модель|ии-ассистент|ai-ассистент|искусственный интеллект),? я"
      - "чем (?:ещё )?могу (?:вам |тебе )?помочь"
      - "обращайтесь,? если"
      - "я всего лишь (?:программа|бот|модель)"
      - "надеюсь,? (?:это|мой ответ) (?:было|был) полезн"
  source_world:
    description: Названия исходного мира и его персонажей (досье §16 — у неё свой мир)
    patterns:
      - "фатуи"
      - "предвестни"
      - "тейват"
      - "геншин|genshin|hoyoverse|mihoyo"
      - "(?-i:\\bСнежн(?:ая|ой|ую))\\b"
      - "(?-i:\\bЦариц[аеыу])\\b"
      - "мондштадт|ли юэ|инадзум|сумеру|фонтейн|натлан|нод-край|nod-krai"
      - "дотторе|сандроне|арлекино|пьеро\\b|скарамучч|тарталь|синьор[аы]|капитано|пульчинелл|панталоне"
      - "\\bпаймон|\\bпутешественни(?:к|ца) из другого мира"
  divinity:
    description: Божественные черты
    patterns:
      - "благословляю"
      - "я (?:твоя |ваша )?богиня"
      - "я исполню (?:твоё|твое|ваше) желание"
      - "я (?:знаю|вижу) (?:твоё|твое) будущее"

soft:
  stage_directions:
    description: Действия в звёздочках или скобках
    patterns:
      - "\\*[^*\\n]{2,60}\\*"
      - "^\\([^)\\n]{2,60}\\)\\s*"
  diminutives:
    description: Сюсюканье и ласкательные прозвища
    words: [солнышко, зайка, котик, малыш, милашка, лапочка, дорогуша, пупсик, сладкий, сладкая]

# Характерные приметы, которые нельзя повторять слишком часто.
# window — сколько её последних ответов учитывать; max — сколько раз можно встретить в окне.
signature_markers:
  window: 6
  markers:
    hm_opening: {pattern: "^(?:хм|а)\\?\\.\\.", max: 1, hint: "не начинай с «Хм?..» / «А?..»"}
    ellipsis_heavy: {pattern: "\\.\\.\\.|…", max: 4, hint: "меньше многоточий"}
    moon: {pattern: "лун", max: 2, hint: "не упоминай луну без повода"}
    spirits: {pattern: "дух", max: 2, hint: "не упоминай духов без повода"}
    opera: {pattern: "опер|сцен", max: 1, hint: "театральные образы реже"}
    question_end: {pattern: "\\?\\s*$", max: 4, hint: "не заканчивай каждый ответ вопросом"}

max_exclamations: 1
