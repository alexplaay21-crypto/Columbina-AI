# Запуск:  cp .env.example .env  →  заполнить ключи и POSTGRES_PASSWORD  →  docker compose up -d --build
# Логи:    docker compose logs -f bot
# Бэкап:   docker compose exec db pg_dump -U columbina columbina > backup.sql

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: columbina
      POSTGRES_USER: columbina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U columbina -d columbina"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Порт наружу не открыт: база доступна только боту внутри сети compose.

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://columbina:${POSTGRES_PASSWORD}@db:5432/columbina
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - botvar:/app/var
    stop_grace_period: 20s

volumes:
  pgdata:
  botvar:
